<script src="https://{{ recaptcha_domain }}/recaptcha/api.js?render={{ public_key }}{% if api_params %}&{{ api_params }}{% endif %}"></script>
<script>
    var element_{{ widget_uuid }};
    grecaptcha.ready(function() {
        element_{{ widget_uuid }} = document.querySelector('.g-recaptcha[data-widget-uuid="{{ widget_uuid }}"]');
        element_{{ widget_uuid }}.form.addEventListener('submit', recaptchaFormSubmit{{ widget_uuid }});
        console.log(element_{{ widget_uuid }});
    });
    function recaptchaFormSubmit{{ widget_uuid }}(event) {
        event.preventDefault();
        var form = element_{{ widget_uuid }}.form;
        // A second click while the token request is in flight must not start another submit.
        if (form.getAttribute('data-tendenci-async-submit') === 'true') {
            return;
        }
        form.setAttribute('data-tendenci-async-submit', 'true');
        var clickedButton = event.submitter;
        {% if action %}
        grecaptcha.execute('{{ public_key }}', {action: '{{ action|escape }}'})
        {% else %}
        grecaptcha.execute('{{ public_key }}', {})
        {% endif %}
        .then(function(token) {
            console.log("reCAPTCHA validated for 'data-widget-uuid=\"{{ widget_uuid }}\"'. Setting input value...")
            element_{{ widget_uuid }}.value = token;
            if (clickedButton && clickedButton.name) {
                var hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.name = clickedButton.name;
                hiddenInput.value = clickedButton.value;
                form.appendChild(hiddenInput);
            }
            // An input named "submit" shadows form.submit, so call the native method.
            HTMLFormElement.prototype.submit.call(form);
        })
        .catch(function() {
            form.removeAttribute('data-tendenci-async-submit');
            form.dispatchEvent(new CustomEvent('tendenci:submit-cancelled', { bubbles: true }));
        });
    }
</script>
